<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Log in — Money in Plain English</title>
<link rel="stylesheet" href="/shell.css">
<style>
  body { max-width: 360px; margin: 40px auto 80px; padding: 0 24px; box-sizing: border-box; }
  .brand { text-align: center; margin-bottom: 32px; }
  .brand img { width: 140px; height: auto; }
  .brand p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 12px 0 0; }
  input { display: block; width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
  button { width: 100%; padding: 10px; }
  #msg { color: #b00020; margin-top: 8px; }
  a { color: var(--sage); }
</style>
</head>
<body>
  <div class="brand">
    <img src="/logo.png" alt="Money in Plain English">
    <p>Your money, finally in plain english. We turn your bank transactions into a clear weekly summary — so you always know where your money went, without building a budget yourself.</p>
  </div>
  <h2>Log in</h2>
  <form id="login-form">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>
  <div id="msg"></div>
  <p><a href="/signup.html">Need an account? Sign up</a></p>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('msg').textContent = data.error;
        return;
      }
      window.location.href = '/accounts.html';
    });
  </script>
</body>
</html>
