<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign up — Money in Plain English</title>
<link rel="stylesheet" href="/shell.css">
<style>
  body { max-width: 360px; margin: 80px auto; padding: 0 24px; box-sizing: border-box; }
  input { display: block; width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
  button { width: 100%; padding: 10px; }
  #msg { color: #b00020; margin-top: 8px; }
  a { color: var(--sage); }
</style>
</head>
<body>
  <h2>Sign up</h2>
  <form id="signup-form">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Create account</button>
  </form>
  <div id="msg"></div>
  <p><a href="/login.html">Already have an account? Log in</a></p>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('msg').textContent = data.error;
        return;
      }
      window.location.href = '/accounts.html';
    });
  </script>
</body>
</html>
